name: Build Test APK (no secrets)

# 手动触发的免密钥测试打包：在 Actions 页面点 "Run workflow" 即可产出一个
# 可直接安装的 debug APK，仓库无需配置任何 secrets。
#
# 与 build-apk.yml 的分工（二者互不重叠、互不干扰）：
#   - build-apk.yml ：正式发布流水线（push main 触发）。从源码构建 proot 原生库、
#                     跑全量单测、用固定调试密钥签名、校验签名/产物并发布滚动
#                     release；依赖 DEBUG_KEYSTORE_B64 等 secrets，缺失即失败。
#   - build-test-apk.yml（本文件）：自用 / 分支测试用。纯 debug 构建，复用仓库内
#                     已提交的预编译 .so，零 secrets 依赖；只上传 Actions artifact，
#                     不发布 release、不覆盖任何正式产物。
#
# 设计取舍（辩证吸收 RikkaHub 的“推 commit 即构建”策略，同时保留本项目的严谨约定）：
#   - 触发条件：推送任意【非 main】分支即自动构建（含本迁移分支），改完推上去
#     就能看到构建，无需手动点；main 交给 build-apk.yml，故 branches-ignore
#     排除 main，避免同一次 push 双跑。
#   - 保留扫描门禁（scan gate）先行，和正式流水线同一套静态检查；
#   - Gradle 构建带 3 次重试，吸收上游对 CI 网络抖动的容忍策略；
#   - 失败时输出诊断日志，便于定位。
on:
  push:
    # main 由 build-apk.yml（正式发布流水线）负责，这里排除以杜绝重复构建。
    branches-ignore: [ main ]
  workflow_dispatch:

# 同一 ref 的测试构建可被新的一次取消，避免排队堆积（正式流水线用另一个 group）。
concurrency:
  group: build-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # deps/proot 是子模块；虽然 debug 构建复用已提交的预编译 .so（不重建原生库），
      # 但 checkout 仍需拉全子模块，保证仓库状态与本地一致。
      # fetch-depth: 0 + tags 是 "Compute version" 步骤必需的：版本号取自最近 v* tag
      # 与提交数，depth-1 的浅克隆会得到「1 个提交、无 tag」的错误值。
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      # 版本号从 git 推导（与 build-apk.yml 同一套规则，build.gradle.kts 消费同名
      # 环境变量）：versionName = <最近 v* tag，否则 1.0.0>.<距该 tag 的提交数>.r<sha>，
      # 例如 1.0.0.12.r3f2a1b7，便于确认这个包来自哪个 commit；
      # versionCode = 10 亿 + 总提交数（高基数保证不低于已发布版本，避免降级安装）。
      # 注意不要用 "-"：应用内比较器会在第一个 "-" 处截断版本名。
      - name: Compute version
        id: version
        run: |
          BASE_TAG=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || echo "")
          if [ -n "$BASE_TAG" ]; then
            BASE_VER="${BASE_TAG#v}"
            SINCE=$(git rev-list --count "${BASE_TAG}..HEAD")
          else
            BASE_VER="1.0.0"
            SINCE=$(git rev-list --count HEAD)
          fi
          TOTAL=$(git rev-list --count HEAD)
          SHORT=$(git rev-parse --short=7 HEAD)
          VERSION_NAME="${BASE_VER}.${SINCE}.r${SHORT}"
          VERSION_CODE=$((1000000000 + TOTAL))
          echo "base_tag=${BASE_TAG:-<none>} since=${SINCE} total=${TOTAL}"
          echo "version_name=$VERSION_NAME  version_code=$VERSION_CODE"
          echo "MINIS_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "MINIS_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      # 与正式流水线同一套静态扫描：四路同步、i18n 孤儿键、裸 valueOf 等。
      # 纯 Python，早失败早暴露，保持与 build-apk.yml 一致的严谨度。
      - name: Run pre-build scan gate
        run: |
          python3 --version || (echo "::error::python3 is required for the scan gate" && exit 1)
          sh scripts/scan/scan.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 与 build-apk.yml 一致：只请求 platform-tools（Google 已下架旧 `tools` 包）。
          packages: 'platform-tools'

      # debug 构建不需要 NDK / 签名密钥，但仍需接受 SDK 许可，供 AGP 按需补齐平台包。
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # mergeDebugAssets 会触发 stageDebugSkillAssets（Exec 任务读取该目录）。
      # 该技能目录在公开镜像中缺失，这里建一个空目录，避免 Exec 输入目录不存在。
      # 脚本本身对 SKILL.md 缺失有兜底，故 debug 产物体积与行为均不受影响。
      - name: Stub missing private inputs
        run: mkdir -p .claude/skills/debug-server

      # debug 变体由 AGP 自动用调试密钥签名，安装即用，无需任何 secret。
      # 带 3 次重试以吸收 CI 依赖下载的网络抖动（吸收上游策略）。
      - name: Build debug APK (retry x3)
        run: |
          cd src/android
          chmod +x gradlew
          for i in 1 2 3; do
            echo "=== assembleDebug attempt $i ==="
            ./gradlew assembleDebug --stacktrace && break
            [ $i -lt 3 ] && { echo "build failed, retrying in 15s..."; sleep 15; } || exit 1
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: RikkaMinis-test-${{ steps.version.outputs.version_name }}
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 吸收上游的失败诊断策略：把 Gradle 日志尾部与依赖树打出来，便于定位。
      - name: Build failure diagnostics
        if: failure()
        run: |
          echo "=== last 150 gradle log lines ==="
          find . -name "*.log" -path "*gradle*" 2>/dev/null | while read -r f; do
            echo "--- $f ---"
            tail -n 150 "$f"
          done
          echo "=== diagnostic: :app:dependencies --configuration debugRuntimeClasspath ==="
          cd src/android && ./gradlew :app:dependencies --configuration debugRuntimeClasspath 2>&1 | tail -n 80 || true
